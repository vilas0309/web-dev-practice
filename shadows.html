<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows</title>
    <style>
        h1 {
            /* text-shadow: horizontal-offset vertical-offset blur-radius color; */
            text-shadow: 3px 3px 5px rgba(255, 0, 0, 0.5), -3px -3px 5px rgba(0, 213, 255, 0.5);
        }
        #box {
            width: 200px;
            height: 200px;
            background-color: rgb(212, 212, 212);
            box-shadow: 10px 10px 20px rgba(30, 0, 255, 0.5), -10px -10px 20px rgba(197, 9, 9, 0.5);
        }
    </style>
</head>
<body>
    <h1>Shadows</h1>
    <div id="box"></div>
</body>
</html>
