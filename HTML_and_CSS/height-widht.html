<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and width</title>
    <style>
        /*The height and width properties are used to set the height and width of an element. The height and width can be set in px, em, %, etc. The height and width can also be set to auto, which means that the element will automatically adjust its size based on its content.*/
        *{
            /*The box-sizing property is used to alter the default CSS box model used to calculate width and height of the elements. The box-sizing property can take one of the following values: content-box, border-box, padding-box.*/
            box-sizing: border-box;
        }
        .container{
            background-color: rgb(83, 78, 78);
            /*The height property is used to set the height of an element. The height can be set in px, em, %, etc. The height can also be set to auto, which means that the element will automatically adjust its size based on its content.*/
            height: 100vh;
        }
        .box{
            /*The border property is used to set the border of an element. The border can be set in px, em, %, etc. The border can also be set to auto, which means that the element will automatically adjust its size based on its content.*/
            border: 2px solid;
            /*The padding property is used to set the padding of an element. The padding can be set in px, em, %, etc. The padding can also be set to auto, which means that the element will automatically adjust its size based on its content.*/
            padding: 25px;
            /*The text-align property is used to set the horizontal alignment of the text within an element.*/
            text-align: center;
            /*The width property is used to set the width of an element. The width can be set in px, em, %, etc. The width can also be set to auto, which means that the element will automatically adjust its size based on its content.*/
            width: 50%;
            /*The height property is used to set the height of an element. The height can be set in px, em, %, etc. The height can also be set to auto, which means that the element will automatically adjust its size based on its content.*/
            height: auto;
            float:left;
            background-color: rgb(239, 189, 189);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <h3>Box 1</h3>
            <!-- <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, quod.</p> -->
        </div>
        <div class="box">
            <h3>Box 2</h3>
            <!-- <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, quod.</p> -->
        </div>
    </div>
</body>
</html>
