<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformers</title>
    <style>
        #box1{
            height: 100px;
            width: 100px;
            border: 2px solid;
            font-size: 5em;
            text-align: center;
            background-color: aqua;

            transform: translate(300px,10px);
        }
        #box2{
            height: 100px;
            width: 100px;
            border: 2px solid;
            font-size: 5em;
            text-align: center;
            background-color: blue;

            transform: scale(2);
        }
        #box3{
            height: 100px;
            width: 100px;
            border: 2px solid;
            font-size: 5em;
            text-align: center;
            background-color: blueviolet;

            transform: rotateZ(45deg);
        }
        #box4{
            height: 100px;
            width: 100px;
            border: 2px solid;
            font-size: 5em;
            text-align: center;
            background-color: brown;

            transform: skewX(45deg);
        }
    </style>
</head>
<body>
    <div id="box1">1</div>
    <div id="box2">2</div><br><br><br><br>
    <div id="box3">3</div><br><br>
    <div id="box4">4</div>
</body>
</html>
