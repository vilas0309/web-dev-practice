<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Image</title>
    <!--The background-image property is used to set an image as the background of an element. The background-image property can take one or more images, and they can be set to repeat, no-repeat, or cover the entire element.-->
    <style>
        body{
            /*The background-image property is used to set an image as the background of an element. The background-image property can take one or more images, and they can be set to repeat, no-repeat, or cover the entire element.*/
            background-image:url(images/images.jfif);
            /*The background-repeat property is used to set whether a background image should be repeated or not. The background-repeat property can take one of the following values: repeat, no-repeat, repeat-x, repeat-y, space, round.*/
            background-repeat:no-repeat;
            /*The background-size property is used to set the size of a background image. The background-size property can take one of the following values: auto, cover, contain, length, percentage.*/
            background-size:cover;
            /*The background-position property is used to set the position of a background image. The background-position property can take one of the following values: top, bottom, left, right, center, length, percentage.*/
            background-position:center;
            /*The background-attachment property is used to set whether a background image should scroll with the rest of the page or be fixed in place. The background-attachment property can take one of the following values: scroll, fixed, local.*/
            background-attachment:fixed;
        }
    </style>
</head>
<body>
    <h1>Background Image</h1>
    <p>Background images are images that are set as the background of an element. They can be set using the CSS background-image property. The background-image property can take one or more images, and they can be set to repeat, no-repeat, or cover the entire element.</p>
</body>
</html>
