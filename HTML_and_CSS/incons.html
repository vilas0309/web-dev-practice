<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icons</title>
    <script src="https://kit.fontawesome.com/0e5a0fd795.js" crossorigin="anonymous"></script>
    <style>
        .icons{
            text-align: center;
        }
        .icons a{
            text-decoration: none;
            margin: 10px;
        }
        .fa-house.fa-5x{
            color: rgb(111, 108, 108);
        }
        .fa-house.fa-5x:hover{
            color: rgb(36, 36, 36);
        }
        .fa-twitter.fa-5x{
            color:aqua
        }
        .fa-twitter.fa-5x:hover{
            color:rgb(1, 136, 136)
        }
        .fa-youtube.fa-5x{
            color: red;
        }
        .fa-youtube.fa-5x:hover{
            color: rgb(144, 0, 0);
        }
        .fa-github.fa-5x{
            color: purple;
        }
        .fa-github.fa-5x:hover{
            color: rgb(98, 0, 98);
        }
    </style>
</head>
<body>
    <div class="icons">
        <a href=""> 
             <i class="fa-solid fa-house fa-5x"></i>
        </a>
       <a href="https://twitter.com" target="_blank">
            <i class="fa-brands fa-twitter fa-5x"></i>
       </a>
        <a href="https://www.youtube.com" target="_blank">
            <i class="fa-brands fa-youtube fa-5x"></i>
        </a>
        <a href="https://github.com" target="_blank">
            <i class="fa-brands fa-github fa-5x"></i>
        </a>
        
    </div>
</body>
</html>
