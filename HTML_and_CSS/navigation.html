<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation</title>
    <style>
        body{
            margin: 0;
        }
        main{
            margin-left: 20px;
            margin-right: 20px;
        }
        h1{
            text-align: center;
        }
        .navigation ul{
            background-color: hsl(0, 0%, 25%);
            list-style-type: none;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }
        .navigation a{
            text-decoration: none;
            color: white;
            padding: 20px;
            display: block;
            text-align: center;
            
        }
        .navigation a:hover{
            background-color: hsl(0, 0%, 11%);
        }
        .navigation li{
            float: left;
        }
    </style>
</head>
<body>
    <h1>Navigation</h1>
    <!--The <nav> tag in HTML defines a section of a webpage that contains navigation links-->
    <nav class="navigation">
        <ul>
            <li><a href="">Home</a></li>
            <li><a href="">About us</a></li>
            <li><a href="">Product</a></li>
            <li><a href="">Conatc</a></li>
        </ul>
    </nav>
    <main>
        <h3>This is main page</h3>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Reprehenderit facere vitae nam commodi dicta, eveniet quis! Ut modi harum nesciunt debitis cum beatae quisquam accusantium error, corrupti at, sit esse.</p>
    </main>
</body>
</html>
