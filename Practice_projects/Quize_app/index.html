<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quize App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="screen active" id="start-screen">
            <h1>Quize Time!</h1>
            <p>Test your knowledge with these questions</p>
            <button id="start-btn">Start quize</button>
        </div>

        <div class="screen" id="quize-screen">
            <div class="quize-header">
                <h2 id="question-text">Question goes here</h2>
                <div id="quize-info">
                    <p>Question <span id="current-qestion">1</span> of <span id="max-question">5</span></p>

                    <p>Score:<span id="score">0</span></p>
                </div>
            </div>
            <div class="answer-container" id="answer-container">
                <!-- Answers go here from javascript -->
            </div>

            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
        </div>

        <div class="screen" id="result-screen">
            <h1>Quize Results!</h1>
            <div class="result-info">
                <p>You scored <span id="final-score">0</span> out of <span id="max-question">5</span></p>
                <div id="result-message"></div>
            </div>
            <button id="retart-btn">Restart Quize</button>
        </div>
     </div>
</body>
</html>
