<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="container">
        <h1>Password Generator</h1>

        <div class="password-container">
            <input type="tel" name="" id="password" readonly>
            <i class="far fa-copy" id="copy-btn" title="Copy to clipboard"></i>
        </div>

        <!-- options -->
         <div class="options">
            <!-- password lenght -->
             <div class="option">
                <label for="length">Password Length</label>
                <input type="range" name="" id="length" min="6" max="24" value="12">
                <span id="length-value">12</span>
             </div>
             <div class="option">
                <label for="uppercase">Include Uppercase</label>
                <input type="checkbox" name="" id="uppercase" checked>
             </div>

             <div class="option">
                <label for="lowercase">Include Lowercase</label>
                <input type="checkbox" name="" id="lowercase" checked>
             </div>

             <div class="option">
                <label for="numbers">Include Number</label>
                <input type="checkbox" name="" id="numbers" checked>
             </div>

             <div class="option">
                <label for="symbols">Include Symbols</label>
                <input type="checkbox" name="" id="symbols" checked>
             </div>


         </div>

         <button id="generate-btn"><i class="fas fa-key"></i>Generate Password</button>
         <div class="strength-container">
            <p>Password Strength: <span id="strength-label">Medium</span></p>

            <div class="strength-meter">
                <div class="strength-bar"></div>
            </div>
         </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
