<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Element Selectors</title>
</head>
<body>
    <h1 id="welcome-msg">Element Selectors</h1>
    <p id="paragraph">This is a paragraph.</p>
    <div id="div">This is a div.</div>
    <span id="span">This is a span.</span>

    <h4 id="fruits">Fruits</h4>
    <ul id="fruit-list">
        <li class="fruit">Apple</li>
        <li class="fruit">Banana</li>
        <li class="fruit">Cherry</li>
        <li class="fruit">Date</li>
        <li class="fruit">Elderberry</li>
    </ul>
    <h4 id="vegetables">Vegetables</h4>
    <ul id="vegetable-list">
        <li class="vegetable">Asparagus</li>
        <li class="vegetable">Broccoli</li>
        <li class="vegetable">Carrot</li>
        <li class="vegetable">Daikon</li>
        <li class="vegetable">Eggplant</li>
    </ul>
    <script src="index.js"></script>
</body>
</html>
