<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <h1>Store hours</h1>
    <!--table tag start-->
    <table border="2" style="background-color: black;">
        <!--define the table rows-->
        <tr style="background-color: aqua;">
            <!--define the table headers-->
            <th width="100">Sun</th>
            <th width="100">Mon</th>
            <th width="100">Tue</th>
            <th width="100">Wed</th>
            <th width="100">Thu</th>
            <th width="100">Fri</th>
            <th width="100">Sat</th>
        </tr>
        <tr align="center" style="background-color: lightblue;">
            <!--define the table data cells-->
            <td>Closed</td>
            <td>8-5</td>
            <td>8-5</td>
            <td>8-5</td>
            <td>8-5</td>
            <td>8-5</td>
            <td>10-3</td>
        </tr>
    </table>
</body>
</html>
