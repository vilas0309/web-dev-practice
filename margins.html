<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margins</title>
    <!--Margins are the spaces around an element's border-->
    <style>
        #box1 {
            width: 200px;
            height: 200px;
            background-color: rgb(241, 47, 47);
            margin:auto
        }
        #box2 {
            width: 200px;
            height: 200px;
            background-color: rgb(47, 241, 47);
            margin-top: 50px;
            margin-right: 100px;
            margin-bottom: 150px;
            margin-left: 200px;
        }
    </style>
</head>
<body>
    <div id="box1" class="box"> Box1</div>
    <div id="box2" class="box"> Box2</div>
</body>
</html>
