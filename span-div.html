<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sapn Div</title>
</head>
<body>
<!-- This is a simple HTML document for the Sapn Div webpage -->
<!-- <span> inline container to group elements for styling -->
<!-- <div> block-level container to group elements for styling -->
    <h1><span style="background-color: tomato;">This is sapn title</span></h1>
    <h1><div style="background-color: cyan;">This is div title</div></h1>
    <p><span style="background-color: yellow;">This is sapn paragraph</span></p>
    <p><div style="background-color: lightgreen;">This is div paragraph</div></p>
    <p>lorem ipsum dolor sit amet, <span style="background-color: lightblue;"> adipiscing elit.</span></p>
    <p>lorem ipsum dolor sit amet, <div style="background-color: lightpink;"> adipiscing elit.</div></p>
</body>
</html>
